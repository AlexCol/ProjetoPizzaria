<dialog
  #dialog
  [class]="styles.dialog"
  tabindex="-1"
  [attr.aria-label]="ariaLabel()"
  (cancel)="handleCancel($event)"
  (click)="handleBackdropClick($event)"
  (keydown)="handleKeydown($event)"
  (close)="handleClose()"
>
  <div [class]="styles.content">
    <ng-content />
  </div>
</dialog>
