<header [class]="styles.header">
  <app-link [routerLink]="['home']" variant="unstyled" ariaLabel="Página inicial" [className]="styles.brand">
    <span [class]="styles.brandMark" aria-hidden="true">P</span>
    <span [class]="styles.brandLabel">Pizzaria</span>
  </app-link>

  <div [class]="styles.userInfo" aria-label="Usuário conectado">
    <span [class]="styles.userName">{{ userName }}</span>
    <span> - </span>
    <span [class]="styles.userRole">{{ roleName }}</span>
  </div>

  <nav [class]="styles.nav" aria-label="Navegação principal">
    <app-link label="Home" [routerLink]="['home']" activeClassName="text-secondary!" />
    <app-link *appAuth="['Admin']" label="Usuários" [routerLink]="['usuarios']" activeClassName="text-secondary!" />
    <app-button
      variant="default"
      type="button"
      allowSpam
      [fullWidth]="false"
      [ariaLabel]="isDark ? 'Ativar modo claro' : 'Ativar modo escuro'"
      [title]="isDark ? 'Ativar modo claro' : 'Ativar modo escuro'"
      (clicked)="toggleTheme()"
    >
      <span aria-hidden="true">{{ isDark ? '☀️' : '🌙' }}</span>
    </app-button>
    <app-button label="Sair" variant="link" type="button" [fullWidth]="false" (clicked)="logout()" />
  </nav>
</header>
