<header class="site-header">
  <a class="brand" routerLink="/home" aria-label="Página inicial">
    <span class="brand-mark" aria-hidden="true">P</span>
    <span>Pizzaria</span>
  </a>

  <div class="user-info" aria-label="Usuário conectado">
    <span class="user-name">{{ userName }}</span>
    <span> - </span>
    <span class="user-role">{{ roleName }}</span>
  </div>

  <nav aria-label="Navegação principal">
    <a routerLink="/home" routerLinkActive="active">Home</a>
    <a *appAuth="['Admin']" routerLink="/usuarios" routerLinkActive="active">Usuários</a>
    <button
      class="theme-toggle"
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="isDark ? 'Ativar modo claro' : 'Ativar modo escuro'"
      [attr.title]="isDark ? 'Ativar modo claro' : 'Ativar modo escuro'"
    >
      <span aria-hidden="true">{{ isDark ? '☀️' : '🌙' }}</span>
    </button>
    <button type="button" class="logout-button" (click)="logout()">Sair</button>
  </nav>
</header>
