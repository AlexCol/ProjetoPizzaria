<main [class]="styles.page">
  <header [class]="styles.header">
    <!-- Cabeçalho da tela -->
    <div>
      <h1 [class]="styles.title">Usuários</h1>
      <p [class]="styles.subtitle">Gerencie as pessoas com acesso ao sistema.</p>
    </div>
    <!-- Botao para criação de novo usuário -->
    <ng-container *appAuth="['Admin']">
      <app-button label="Novo usuário" variant="primary" [fullWidth]="false" (clicked)="openModal()" />
    </ng-container>
  </header>

  <!-- Criação do datatable -->
  <section [class]="styles.gridSection" aria-label="Lista de usuários">
    <app-data-table
      [data]="users()"
      [columns]="tableColumns()"
      [loading]="loading()"
      emptyMessage="Nenhum usuário encontrado."
    />
  </section>
</main>

<!-- --------------------------------------------- -->
<!-- Blocos não renderizados autimaticamente.      -->
<!-- eles são injetados via pelo componente via    -->
<!-- createUsuariosTableColumns()                  -->
<!-- --------------------------------------------- -->

<!-- --------------------------------------------- -->
<!-- statusTemplate - apresentado sempre           -->
<!-- --------------------------------------------- -->
<ng-template appUserTemplate #statusTemplate let-user>
  <span [class]="user.status === 'Active' ? styles.activeBadge : styles.inactiveBadge">
    {{ statusLabel(user.status) }}
  </span>
</ng-template>

<!-- --------------------------------------------- -->
<!-- actionsTemplate - apresentado se user = Admin -->
<!-- --------------------------------------------- -->
<ng-template appUserTemplate #actionsTemplate let-user>
  <div [class]="styles.actionsCell">
    <app-button
      variant="unstyled"
      ariaLabel="Editar usuário"
      title="Editar"
      [fullWidth]="false"
      [className]="styles.iconButton"
      (clicked)="openModal(user)"
      [allowSpam]="true"
    >
      <lucide-icon [img]="Edit" strokeWidth="2" />
    </app-button>
    <app-button
      variant="unstyled"
      ariaLabel="Excluir usuário"
      title="Excluir"
      [fullWidth]="false"
      [className]="styles.deleteIconButton"
      (clicked)="requestDelete(user)"
      [allowSpam]="true"
    >
      <lucide-icon [img]="Trash2" strokeWidth="2" />
    </app-button>
  </div>
</ng-template>

<!-- --------------------------------------------- -->
<!-- Modal para criação/edição de usuário          -->
<!-- --------------------------------------------- -->
<app-modal
  [(isOpen)]="modalOpen"
  [ariaLabel]="selectedUser() ? 'Editar usuário' : 'Novo usuário'"
  [blockBackdropClose]="true"
>
  <!-- com if, o modal só é criado quando manda ser aberto -->
  <!-- e ele é destruido quando fecha, assim não fica resquicio de campo com erro -->
  @if (modalOpen()) {
    <app-usuario-modal
      [user]="selectedUser()"
      [roleOptions]="roleOptions()"
      [saving]="saving()"
      (closeModal)="closeModal()"
      (saveUser)="saveUser($event)"
    />
  }
</app-modal>

<!-- --------------------------------------------- -->
<!-- Modal para confirmação de exclusão de usuário -->
<!-- --------------------------------------------- -->
<app-modal [(isOpen)]="deleteModalOpen" ariaLabel="Confirmar exclusão" [blockBackdropClose]="true">
  <section [class]="styles.confirmation">
    <h2 [class]="styles.confirmationTitle">Excluir usuário</h2>
    <p>
      Tem certeza que deseja excluir <strong>{{ userToDelete()?.name }}</strong
      >? Esta ação não pode ser desfeita.
    </p>
    <div [class]="styles.confirmationActions">
      <app-button
        label="Cancelar"
        variant="unstyled"
        [fullWidth]="false"
        (clicked)="cancelDelete()"
        [allowSpam]="true"
      />
      <app-button
        label="Excluir"
        variant="danger"
        [fullWidth]="false"
        [disabled]="deleting()"
        (clicked)="confirmDelete()"
      />
    </div>
  </section>
</app-modal>
