<section [class]="styles.form">
  @if (!user()) {
    <h2 [class]="styles.title">Novo usuário</h2>
  } @else {
    <h2 [class]="styles.title">Editar usuário</h2>
  }

  <!-- Conteúdo do modal -->

  <app-button type="button" label="Fechar" variant="danger" (click)="close()" />
  <app-button type="submit" label="Salvar" variant="success" (click)="save()" />
</section>
