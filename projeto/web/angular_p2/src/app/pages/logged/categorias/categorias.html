<main [class]="styles.page">
  <header [class]="styles.header">
    <div>
      <h1 [class]="styles.title">Categorias</h1>
      <p [class]="styles.subtitle">Gerencie as categorias dos produtos.</p>
    </div>

    <ng-container *appAuth="['Admin']">
      <app-button label="Nova categoria" variant="primary" [fullWidth]="false" (clicked)="openModal()" />
    </ng-container>
  </header>

  <section [class]="styles.gridSection" aria-label="Lista de categorias">
    <app-data-table
      [data]="categories()"
      [columns]="tableColumns()"
      [loading]="loading()"
      emptyMessage="Nenhuma categoria encontrada."
    />
  </section>
</main>

<ng-template #actionsTemplate let-category>
  <div [class]="styles.actionsCell">
    <app-button
      variant="unstyled"
      ariaLabel="Editar categoria"
      title="Editar"
      [fullWidth]="false"
      [className]="styles.iconButton"
      [allowSpam]="true"
      (clicked)="openModal(category)"
    >
      <lucide-icon [img]="Edit" strokeWidth="2" />
    </app-button>

    <app-button
      variant="unstyled"
      ariaLabel="Excluir categoria"
      title="Excluir"
      [fullWidth]="false"
      [className]="styles.deleteIconButton"
      [allowSpam]="true"
      (clicked)="requestDelete(category)"
    >
      <lucide-icon [img]="Trash2" strokeWidth="2" />
    </app-button>
  </div>
</ng-template>

<app-modal
  [(isOpen)]="modalOpen"
  [ariaLabel]="selectedCategory() ? 'Editar categoria' : 'Nova categoria'"
  [blockBackdropClose]="true"
>
  @if (modalOpen()) {
    <app-categoria-modal
      [category]="selectedCategory()"
      [saving]="saving()"
      (closeModal)="closeModal()"
      (saveCategory)="saveCategory($event)"
    />
  }
</app-modal>

<app-modal [(isOpen)]="deleteModalOpen" ariaLabel="Confirmar exclusão" [blockBackdropClose]="true">
  <section [class]="styles.confirmation">
    <h2 [class]="styles.confirmationTitle">Excluir categoria</h2>
    <p>
      Tem certeza que deseja excluir <strong>{{ categoryToDelete()?.name }}</strong
      >? Esta ação não pode ser desfeita.
    </p>

    <div [class]="styles.confirmationActions">
      <app-button
        label="Cancelar"
        variant="unstyled"
        [fullWidth]="false"
        [allowSpam]="true"
        (clicked)="cancelDelete()"
      />
      <app-button
        label="Excluir"
        variant="danger"
        [fullWidth]="false"
        [disabled]="deleting()"
        (clicked)="confirmDelete()"
      />
    </div>
  </section>
</app-modal>
