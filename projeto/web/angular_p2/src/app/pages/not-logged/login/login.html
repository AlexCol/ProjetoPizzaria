<main [class]="styles.page">
  <section [class]="styles.card" aria-labelledby="login-title">
    <div [class]="styles.brand">
      <span [class]="styles.brandMark" aria-hidden="true">P</span>
      <span>Pizzaria</span>
    </div>

    <h1 id="login-title" [class]="styles.title">Acesse sua conta</h1>

    <form #loginForm="ngForm" [class]="styles.form" (ngSubmit)="login(loginForm)" novalidate>
      <div [class]="styles.field">
        <app-input
          #email="ngModel"
          [(ngModel)]="credentials.email"
          id="email"
          name="email"
          type="email"
          label="E-mail"
          placeholder="seu@email.com"
          autoComplete="email"
          ariaDescribedBy="email-error"
          [ariaInvalid]="email.invalid && email.touched"
          required
          email
        />

        @if (email.invalid && email.touched) {
          <small id="email-error" [class]="styles.validationError">Informe um e-mail válido.</small>
        }
      </div>

      <div [class]="styles.field">
        <app-input
          #password="ngModel"
          [(ngModel)]="credentials.password"
          id="password"
          name="password"
          type="password"
          label="Senha"
          placeholder="Sua senha"
          autoComplete="current-password"
          ariaDescribedBy="password-error"
          [ariaInvalid]="password.invalid && password.touched"
          required
        />

        @if (password.invalid && password.touched) {
          <small id="password-error" [class]="styles.validationError">Informe sua senha.</small>
        }
      </div>

      <app-button label="Acessar" type="submit" />

      <app-check
        [(ngModel)]="credentials.remember"
        name="remember"
        label="Lembrar-me"
        [className]="styles.rememberInput"
        [labelClassName]="styles.rememberLabel"
        [class]="styles.rememberOption"
      />
    </form>

    <app-link label="Esqueceu a senha? Clique aqui." href="#" [className]="styles.signupLink" />
  </section>
</main>
