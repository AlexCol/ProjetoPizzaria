@if (status() === 'loading') {
  <app-loader />
} @else {
  <main [class]="styles.page">
    <section [class]="styles.card" aria-labelledby="title">
      <div [class]="styles.brand">
        <span [class]="styles.brandMark" aria-hidden="true">P</span>
        <span>Pizzaria</span>
      </div>

      <h1 id="title" [class]="styles.title">Recuperar senha</h1>

      @if (status() === 'error') {
        <div [class]="styles.errorMessage">
          <p>{{ message() }}</p>
        </div>
      } @else if (status() === 'success') {
        <div [class]="styles.message">
          <p>{{ message() }}</p>
        </div>
      } @else {
        <!-- INICIO DO FORM -->
        <form [formGroup]="form" [class]="styles.form" (ngSubmit)="sendRequest()" novalidate>
          <div [class]="styles.field">
            <app-input
              formControlName="password"
              id="password"
              type="password"
              label="Senha"
              placeholder="Sua nova senha"
              autoComplete="new-password"
              [ariaInvalid]="form.controls.password.invalid && form.controls.password.touched"
            />
          </div>

          <div [class]="styles.field">
            <app-input
              formControlName="confirmPassword"
              id="confirmPassword"
              type="password"
              label="Confirme a senha"
              placeholder="Confirme sua nova senha"
              autoComplete="new-password"
              [ariaInvalid]="
                form.controls.confirmPassword.touched &&
                (form.controls.confirmPassword.invalid || form.hasError('valuesNotEqual'))
              "
            />
          </div>

          <app-button label="Confirmar" type="submit" />
        </form>
      }
    </section>
  </main>
}
