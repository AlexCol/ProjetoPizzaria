<main [class]="styles.page">
  <section [class]="styles.card" aria-labelledby="title">
    <div [class]="styles.brand">
      <span [class]="styles.brandMark" aria-hidden="true">P</span>
      <span>Pizzaria</span>
    </div>

    <h1 id="title" [class]="styles.title">Reenviar email de ativação.</h1>

    @if (status() === 'error') {
      <div [class]="styles.errorMessage">
        <p>{{ message() }}</p>
      </div>
    } @else if (status() === 'success') {
      <div [class]="styles.message">
        <p>{{ message() }}</p>
      </div>
    } @else {
      <form #loginForm="ngForm" [class]="styles.form" (ngSubmit)="sendRequest(loginForm)" novalidate>
        <div [class]="styles.field">
          <app-input
            #email="ngModel"
            [(ngModel)]="credentials.email"
            id="email"
            name="email"
            type="email"
            label="Email"
            placeholder="Seu email"
            autoComplete="email"
            ariaDescribedBy="email-error"
            [ariaInvalid]="email.invalid && email.touched"
            required
            email
          />
        </div>
        <app-button
          [label]="status() === 'loading' ? 'Enviando...' : 'Reenviar'"
          type="submit"
          [disabled]="status() === 'loading'"
        />
      </form>
    }

    <app-link label="Voltar para o login." [routerLink]="['../', 'login']" [className]="styles.signupLink" />
  </section>
</main>
